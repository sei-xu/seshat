services:
  - type: web
    name: seshat
    runtime: python
    pythonVersion: 3.14
    buildCommand: pip install -e ".[dev,telegram]"
    startCommand: >
      python -m seshat.combined.cli
      --vault-root /tmp/vault
      --host 0.0.0.0
      --port $PORT
    envVars:
      - key: SESHAT_API_KEY
        scope: run
      - key: AKASHA_GIT_REMOTE
        scope: run
      - key: SESHAT_TELEGRAM_TOKEN
        scope: run
      - key: SESHAT_TELEGRAM_ALLOWED_USERS
        scope: run
    health:
      path: /health
      checkIntervalSeconds: 30
    autoDeploy: true
    region: ohio
