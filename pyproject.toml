[project]
name = "seshat"
version = "0.1.0"
description = "Agente arquivista do Seîxu — lê e escreve markdown no vault Akasha respeitando o schema. Este pacote (seshat.core) é a lógica de negócio pura da Fase 2; servidor MCP, bot do Telegram etc. entram como submódulos irmãos nas fases seguintes."
requires-python = ">=3.11"
dependencies = [
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
seshat-server = "seshat.mcp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["seshat*"]
